<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>_shots_cards · 卡片幕舞台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0d1114}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#20272e}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;opacity:0}
.scene.on{display:flex;opacity:1}

/* 通用标识 */
.brand{display:grid;grid-template-columns:repeat(3,var(--cs,52px));grid-template-rows:repeat(3,var(--cs,52px));gap:var(--cg,12px)}
.brand i{display:block;border-radius:calc(var(--cs,52px) * 0.23);background:#8EB73C;transform:scale(0);opacity:0}
.brand i.off{visibility:hidden}

/* ---------- s0 片头 ---------- */
#s0{background:#20272e}
#s0 .brand{--cs:52px;--cg:12px;margin-bottom:56px}
#s0 h1{font-size:82px;font-weight:500;color:#fff;letter-spacing:6px;opacity:0}
#s0 .sub{font-size:27px;color:#8d979f;letter-spacing:2px;margin-top:22px;opacity:0}
#s0 .kws{display:flex;gap:18px;margin-top:74px}
#s0 .kws i{font-style:normal;font-size:24px;color:#d6e8a8;border:1px solid rgba(142,183,60,.55);background:rgba(142,183,60,.10);border-radius:26px;padding:11px 32px;opacity:0}
#s0 .stamp{position:absolute;right:44px;bottom:38px;font-size:20px;color:#5a656e;letter-spacing:1px;opacity:0}

/* ---------- s1 痛点 ---------- */
#s1{background:#f5f6f7}
#s1 .lead{font-size:46px;color:#2b3138;font-weight:500;letter-spacing:2px;position:absolute;top:236px;opacity:0}
#s1 .pain{position:absolute;top:352px;left:50%;transform:translateX(-50%);width:1020px;display:flex;flex-direction:column;gap:26px}
#s1 .card{display:flex;align-items:center;gap:26px;background:#fff;border-radius:16px;padding:30px 40px;box-shadow:0 8px 28px rgba(30,40,50,.09);opacity:0}
#s1 .card .dot{width:52px;height:52px;border-radius:14px;background:#f4f9e9;border:1px solid #dbe8bd;display:flex;align-items:center;justify-content:center;font-size:26px;color:#5f7d1f;flex:none}
#s1 .card .txt{font-size:38px;color:#2b3138;letter-spacing:1px}

/* ---------- s9 结尾 ---------- */
#s9{background:#20272e}
#s9 .brand{--cs:34px;--cg:8px;margin-bottom:34px}
#s9 h2{font-size:66px;font-weight:500;color:#fff;letter-spacing:5px;opacity:0}
#s9 .kws{display:flex;gap:16px;margin-top:52px;opacity:1}
#s9 .kws i{font-style:normal;font-size:26px;color:#8d979f;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);border-radius:28px;padding:12px 34px;opacity:0;position:relative}
#s9 .kws i.lit{color:#e8f4d0;border-color:rgba(142,183,60,.7);background:rgba(142,183,60,.16)}
#s9 .rule{width:0;height:1px;background:rgba(255,255,255,.18);margin-top:58px}
#s9 .deliver{display:flex;gap:64px;margin-top:0;opacity:0}
#s9 .deliver div{text-align:center}
#s9 .deliver b{display:block;font-size:30px;font-weight:500;color:#d8dde2;letter-spacing:1px}
#s9 .deliver span{display:block;font-size:19px;color:#79838c;margin-top:7px}
#s9 .stamp{position:absolute;bottom:52px;font-size:19px;color:#5a656e;letter-spacing:1px;opacity:0}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="stage">

  <div class="scene" id="s0">
    <div class="brand" id="b0"></div>
    <h1 id="s0t">星火</h1>
    <div class="sub" id="s0s">面向品牌的多租户内容与分发中台</div>
    <div class="kws" id="s0k"><i>多租户</i><i>插件化</i><i>GEO 闭环</i></div>
    <div class="stamp" id="s0p">演示样片 · 261014</div>
  </div>

  <div class="scene" id="s1">
    <div class="lead" id="s1lead">做内容，到底难在哪？</div>
    <div class="pain" id="s1pain">
      <div class="card"><div class="dot">1</div><div class="txt">一个产品，五个平台</div></div>
      <div class="card"><div class="dot">2</div><div class="txt">每句话都怕踩合规</div></div>
      <div class="card"><div class="dot">3</div><div class="txt">做完了，不知道有没有用</div></div>
    </div>
  </div>

  <div class="scene" id="s9">
    <div class="brand" id="b9"></div>
    <h2 id="s9t">星火</h2>
    <div class="kws" id="s9k"><i>多租户</i><i>插件化</i><i>合规闸门</i><i>GEO 闭环</i></div>
    <div class="rule" id="s9rule"></div>
    <div class="deliver" id="s9d">
      <div><b>按年订阅</b><span>开箱即用，按插件与用量付费</span></div>
      <div><b>私有化部署</b><span>同一套系统，数据不出内网</span></div>
    </div>
    <div class="stamp" id="s9p">Gattefossé 中国 · 数字营销中台</div>
  </div>

  <div id="fade"></div>
</div>

<script>
var LOGO = [1,1,1, 1,0,1, 0,0,1];

function fillBrand(id){
  var box = document.getElementById(id);
  for (var i=0;i<9;i++){
    var el = document.createElement('i');
    if (!LOGO[i]) el.className = 'off';
    box.appendChild(el);
  }
  return box.querySelectorAll('i');
}
var cells0 = fillBrand('b0'), cells9 = fillBrand('b9');

var cl  = function(x){ return x<0?0:(x>1?1:x); };
var seg = function(t,a,b){ return cl((t-a)/(b-a)); };
var es  = function(x){ return x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; };
var eso = function(x){ return 1-Math.pow(1-x,3); };
var ease= function(x){ return 1-Math.pow(1-x,2.6); };

var DUR = { s0: 6.5, s1: 10.32, s9: 11.61 };

function show(id){
  ['s0','s1','s9'].forEach(function(k){
    document.getElementById(k).classList.toggle('on', k === id);
  });
}

function renderS0(t){
  var T = DUR.s0;
  for (var i=0;i<cells0.length;i++){
    if (LOGO[i]===0) continue;
    var st = 0.15 + i*0.13, p = es(seg(t, st, st+0.55));
    cells0[i].style.transform = 'scale(' + (0.55+0.45*p) + ')';
    cells0[i].style.opacity = p;
  }
  var ttl = document.getElementById('s0t'), op = es(seg(t,1.15,1.95));
  ttl.style.opacity = op; ttl.style.transform = 'translateY(' + ((1-op)*22) + 'px)';
  document.getElementById('s0s').style.opacity = es(seg(t,1.5,2.3));
  var kw = document.querySelectorAll('#s0k i');
  for (var k=0;k<kw.length;k++){
    var kp = es(seg(t, 2.15+k*0.42, 2.15+k*0.42+0.5));
    kw[k].style.opacity = kp; kw[k].style.transform = 'translateY(' + ((1-kp)*14) + 'px)';
  }
  document.getElementById('s0p').style.opacity = 0.85*es(seg(t,2.9,3.5));
  document.getElementById('stage').style.transform = 'scale(' + (1 + 0.035*seg(t, 4.9, T)) + ')';
}

var CARDS_IN = [2.45, 5.35, 7.15];
function renderS1(t){
  var lead = document.getElementById('s1lead');
  lead.style.opacity = es(seg(t,0.75,1.5)) * (1 - es(seg(t,2.2,2.7)));
  var cards = document.querySelectorAll('#s1pain .card');
  for (var c=0;c<cards.length;c++){
    var cp = ease(seg(t, CARDS_IN[c], CARDS_IN[c]+0.6));
    cards[c].style.opacity = cp; cards[c].style.transform = 'translateY(' + ((1-cp)*46) + 'px)';
  }
  var lift = seg(t, 9.4, DUR.s1) * 16;
  document.getElementById('s1pain').style.transform = 'translateX(-50%) translateY(-' + lift + 'px)';
}

function renderS9(t){
  var T = DUR.s9;
  for (var i=0;i<cells9.length;i++){
    if (LOGO[i]===0) continue;
    var p = es(seg(t, 0.3+i*0.07, 0.3+i*0.07+0.45));
    cells9[i].style.transform = 'scale(' + (0.6+0.4*p) + ')';
    cells9[i].style.opacity = p;
  }
  var h = document.getElementById('s9t'), hp = es(seg(t,0.95,1.6));
  h.style.opacity = hp; h.style.transform = 'translateY(' + ((1-hp)*18) + 'px)';

  var kw = document.querySelectorAll('#s9k i');
  for (var k=0;k<kw.length;k++){
    var on = es(seg(t, 1.75+k*0.72, 1.75+k*0.72+0.5));
    kw[k].style.opacity = on;
    kw[k].style.transform = 'translateY(' + ((1-on)*12) + 'px)';
    kw[k].classList.toggle('lit', on > 0.95);
    if (on > 0.95) kw[k].style.boxShadow = '0 0 ' + (10*on) + 'px rgba(142,183,60,.30)';
  }
  var rule = document.getElementById('s9rule');
  rule.style.width = (1400 * es(seg(t, 4.6, 5.7))) + 'px';
  var d = document.getElementById('s9d'), dp = es(seg(t, 5.1, 6.1));
  d.style.opacity = dp; d.style.transform = 'translateY(' + ((1-dp)*16) + 'px)';
  document.getElementById('s9p').style.opacity = 0.9*es(seg(t, 6.2, 7.2));
  document.getElementById('stage').style.transform = 'scale(' + (1 + 0.028*seg(t, 8.4, T)) + ')';
}

window.__renderShot = function(id, t){
  show(id);
  document.getElementById('stage').style.transform = 'scale(1)';
  if (id === 's0') renderS0(t);
  else if (id === 's1') renderS1(t);
  else if (id === 's9') renderS9(t);
  var fd = document.getElementById('fade');
  var fi = 1 - seg(t, 0, 0.55);
  var fo = seg(t, DUR[id]-0.7, DUR[id]);
  fd.style.opacity = Math.max(fi, fo);
};
window.__shots = DUR;
window.__ready = true;
</script>
</body>
</html>
