</style>

function toast(msg){
  var el = $('#toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('on'); }, 2100);
}
function setTenant(k){
  state.tenant = k;
  state.view = 'overview';
  state.gen = { src:[], fmt:null, prov:null, running:false, progs:0, log:[], out:[] };
  state.pass = []; state.checks = { identify:false, words:false, rule:false, avatar:false };
  state.pub = { running:false, rows:[] };
  document.documentElement.style.setProperty('--tenant', T().color);
  renderAll();
  toast('已切换到 ' + T().short + '（' + T().plan + '）');
}
function setView(v){ state.view = v; renderAll(); }

function renderAll(){ renderTenantSw(); renderCredit(); renderUser(); renderSidebar(); renderMain(); }

function renderTenantSw(){
  $('#tenantSw').innerHTML = Object.keys(TENANTS).map(function(k){
    var t = TENANTS[k];
    return '<button data-tenant="'+k+'" class="'+(k===state.tenant?'on':'')+'"><span class="dot"></span>'+esc(t.short)+'</button>';
  }).join('');
}
function renderCredit(){
  var t = T();
  $('#creditBox').innerHTML =
    '<div class="row"><span>Credit 余额</span><b>'+t.credits.toLocaleString()+' / '+t.creditsTotal.toLocaleString()+'</b></div>'+
    '<div class="bar"><i style="width:'+creditUsedPct()+'%"></i></div>';
}
function renderUser(){
  var t = T();
  $('#tbUser').innerHTML = '<div class="av">'+esc(t.short.slice(0,1))+'</div><div><div class="nm">'+esc(t.contacts)+'</div><div class="rl">'+esc(t.plan)+' · 管理员</div></div>';
}

function renderSidebar(){
  var t = T(), on = state.plugins[state.tenant] || [];
  var order = ['gen','calendar','publish','compliance','channels','geo','probe','market','revenue'];
  var groups = ['生产','分发','增长','平台'];
  var html = '';
  html += '<div class="tenant-card"><div class="nm">'+esc(t.name)+'</div>'+
          '<div class="mt"><span>'+esc(t.industry)+'</span><span>'+esc(t.plan)+'</span></div>'+
          '<span class="tag">已启用插件 '+on.length+' / 7</span></div>';
  html += '<div class="nav-grp"><div class="t">概览</div>'+
          navItem('overview','总览','') + '</div>';
  groups.forEach(function(g){
    var items = order.filter(function(k){ return PLUGINS[k].grp===g && (on.indexOf(k)>=0 || k==='market' || k==='revenue'); });
    if(!items.length) return;
    html += '<div class="nav-grp"><div class="t">'+g+'</div>';
    items.forEach(function(k){
      var bdg = '';
      if(k==='publish' && state.pass.length) bdg = String(state.pass.length);
      if(k==='compliance' && state.gen.out.length) bdg = String(state.gen.out.filter(function(o){ return !state.pass.some(function(p){return p.id===o.id;}); }).length);
      html += navItem(k, PLUGINS[k].name, bdg);
    });
    html += '</div>';
  });
  var locked = 7 - on.length;
  if(locked > 0) html += '<div class="side-add" data-go="market">+ 还有 '+locked+' 个插件未启用</div>';
  $('#sidebar').innerHTML = html;
}
function navItem(k, name, bdg){
  var active = state.view===k ? ' on' : '';
  var icon = (k==='overview') ? ICONS.home : ICONS[PLUGINS[k].icon];
  return '<div class="nav-item'+active+'" data-view="'+k+'">'+icon+'<span>'+esc(name)+'</span>'+(bdg?'<span class="bdg">'+bdg+'</span>':'')+'</div>';
}

function ph(title, sub, acts){
  return '<div class="ph"><h1>'+esc(title)+'</h1><p>'+sub+'</p>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
}

function renderMain(){
  var v = state.view, on = state.plugins[state.tenant]||[];
  if(v!=='overview' && v!=='market' && v!=='revenue' && on.indexOf(v)<0){
    $('#main').innerHTML = ph('插件未启用','该插件在当前租户未启用，请到「插件市场」启用后再使用。',
      '<button class="btn pri" data-go="market">前往插件市场</button>');
    return;
  }
  var fn = { overview:viewOverview, gen:viewGen, calendar:viewCalendar, publish:viewPublish,
             compliance:viewCompliance, channels:viewChannels, geo:viewGeo, probe:viewProbe,
             market:viewMarket, revenue:viewRevenue }[v];
  $('#main').innerHTML = fn ? fn() : ph('未找到视图','');
}

function viewOverview(){
  var t = T(), on = state.plugins[state.tenant]||[];
  var out = state.gen.out.length, pass = state.pass.length;
  return ph('总览 · '+esc(t.short),
    '当前租户以「'+esc(t.plan)+'」运行，启用插件 '+on.length+' 个。下面四个数字是本月的产出与增长情况。',
    '<button class="btn pri" data-go="gen">开始生成内容</button><button class="btn" data-go="market">管理插件</button><button class="btn" data-go="revenue">查看收入</button>')
  + '<div class="kpis">'
  + kpi('本月产出内容', (236+out)+' <em>条</em>', '较上月 +18%', 1)
  + kpi('已分发平台', '5 <em>个</em>', '公众号 / 抖音 / B站 / 小红书 / 视频号', 0)
  + kpi('AI 引用率', '38 <em>%</em>', '较上月 +6 个百分点', 1)
  + kpi('Credit 已用', Math.round(t.credits/1000)+'k <em>/ '+Math.round(t.creditsTotal/1000)+'k</em>', '用量 '+creditUsedPct()+'%', 0)
  + '</div>'
  + '<div class="cols c3">'
  + '<div class="card"><div class="hd"><h3>生产流水线</h3><span class="sub">今日</span><div class="r"><span class="tag t-b">运行中</span></div></div><div class="bd">'
    + pipeline()
  + '</div></div>'
  + '<div class="card"><div class="hd"><h3>收入概览</h3><span class="sub">本月</span></div><div class="bd">'
    + '<div style="font-size:26px;font-weight:500;margin-bottom:2px">¥'+t.revenue.toLocaleString()+'</div>'
    + '<div style="font-size:11.5px;color:var(--ink3);margin-bottom:14px">较上月 +12.4% · 七条收入线</div>'
    + '<div class="bars">'
    + bar('AI 用量 Credit', 42, 'var(--brand)')
    + bar('插件订阅', 26, '#7F77DD')
    + bar('租户订阅', 18, '#185FA5')
    + bar('通道分账', 9, '#BA7517')
    + bar('其他四条', 5, '#98a2aa')
    + '</div>'
    + '<button class="btn sm" style="margin-top:14px" data-go="revenue">收入明细 →</button>'
  + '</div></div>'
  + '</div>';
}
function kpi(l,v,d,up){ return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d'+(up?' up':'')+'">'+d+'</div></div>'; }
function bar(name, pct, color){
  return '<div class="b"><div class="top"><b>'+name+'</b><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>';
}
function pipeline(){
  var rows = [
    ['素材入库','已完成','t-b'],
    ['内容生成','18 条','t-b'],
    ['合规校验','待人工确认 2 条','t-a'],
    ['分发队列','公众号 · B站','t-bl'],
    ['GEO 监测','本周 1 次','t-g']
  ];
  return '<table><tbody>'+rows.map(function(r){
    return '<tr><td style="width:38%">'+r[0]+'</td><td><span class="tag '+r[2]+'">'+r[1]+'</span></td></tr>';
  }).join('')+'</tbody></table>';
}

function viewGen(){
  var g = state.gen;
  var fmtItem = FORMATS.filter(function(x){ return x.id===g.fmt; })[0];
  var usable = PROVIDERS.filter(function(p){ return !fmtItem || p.cap===fmtItem.cap; });
  var needAvatar = g.fmt==='avatar';
  var step3 = !!g.prov;
  var canGen = g.src.length>0 && g.fmt && g.prov && !g.running;

  var s = ph('内容工厂','选素材 → 选形态 → 选生成通道 → 生成。生成的内容自带 GEO 结构化要素与 AI 标识，可直接进入合规闸门。')
    + '<div class="steps">'
    + step(1,'选素材', g.src.length>0)
    + step(2,'选形态', !!g.fmt)
    + step(3,'选通道', !!g.prov)
    + step(4,'生成', g.out.length>0)
    + '</div>';

  s += '<div class="card"><div class="hd"><h3>① 选择素材</h3><span class="sub">可多选，选中的产品/资料会作为事实来源</span><div class="r"><span class="tag t-g" id="srcCount">已选 '+g.src.length+' 项</span></div></div><div class="bd"><div class="pick">'
    + SOURCES.map(function(x){
        return '<div class="p'+(g.src.indexOf(x.id)>=0?' on':'')+'" data-src="'+x.id+'"><div class="ck"></div><div class="t">'+x.t+'</div><div class="s">'+x.s+'</div></div>';
      }).join('')
    + '</div></div></div>';

  s += '<div class="card"><div class="hd"><h3>② 选择形态</h3><span class="sub">形态决定可用的生成通道</span></div><div class="bd"><div class="pick c3">'
    + FORMATS.map(function(x){
        return '<div class="p'+(g.fmt===x.id?' on':'')+'" data-fmt="'+x.id+'"><div class="ck"></div><div class="t">'+x.t+'</div><div class="s">'+x.s+'</div></div>';
      }).join('')
    + '</div></div></div>';

  s += '<div class="card"><div class="hd"><h3>③ 选择生成通道</h3><span class="sub">'+(g.fmt?('当前形态可用 '+usable.length+' 条通道'):'请先选择形态')+'</span><div class="r"><span class="tag t-a">合作方通道按量计费</span></div></div><div class="bd">'
    + (g.fmt ? '<div class="pick c3">'+usable.map(function(p){
        return '<div class="p'+(g.prov===p.id?' on':'')+'" data-prov="'+p.id+'"><div class="ck"></div><div class="t">'+p.name+'</div><div class="s">'+p.note+'</div><div class="pr">'+p.price+' Credit / '+p.unit+'</div></div>';
      }).join('')+'</div>'
    : '<div class="empty">先在上一步选择形态，通道列表会按能力自动过滤（这就避免了"图文却选了视频通道"这类误操作）</div>')
    + '</div></div>';

  s += '<div class="card"><div class="hd"><h3>④ 生成</h3><span class="sub">长任务异步执行，可离开页面，完成后通知</span><div class="r">'
    + '<span class="tag t-g">预计消耗 '+(canGen||g.running?estimateCredit():0)+' Credit</span>'
    + '<button class="btn pri" id="btnGen" '+(canGen?'':'disabled')+'>'+(g.running?'生成中…':'开始生成')+'</button>'
    + '</div></div><div class="bd">'
    + (g.running || g.log.length ? '<div class="prog" style="margin-bottom:12px"><i id="progBar" style="width:'+g.progs+'%"></i></div><div class="log" id="genLog">'+g.log.join('')+'</div>' : '<div class="empty">选好素材、形态与通道后点「开始生成」</div>')
    + (g.out.length?('<div style="margin-top:16px"><div style="font-size:12.5px;color:var(--ink2);margin-bottom:9px">本轮产物</div>'+g.out.map(function(o){ return outItem(o); }).join('')+'</div>'):'')
    + (needAvatar?'<div class="hint">数字人口播需先在「合规闸门」完成形象与声音授权留痕，未授权不允许生成。</div>':'')
    + '</div></div>';
  return s;
}
function step(n, label, done){ return '<div class="s'+(done?' done':'')+'"><div class="n">'+(done?'✓':n)+'</div>'+label+'</div>'; }
function estimateCredit(){
  var g = state.gen, p = PROVIDERS.filter(function(x){return x.id===g.prov;})[0];
  if(!p || !g.src.length) return 0;
  var base = p.id==='txt'? 24 : (p.id==='vid'? 96 : 144);
  return base * g.src.length;
}
function outItem(o){
  var passed = state.pass.some(function(p){ return p.id===o.id; });
  return '<div class="item"><div class="h"><span class="t">'+esc(o.title)+'</span>'
    + '<span class="tag t-g">'+esc(o.fmt)+'</span><span class="tag t-t">GEO '+o.geo+'</span><span class="tag t-bl">AI 标识已注入</span>'
    + '<div class="r">'+(passed?'<span class="tag t-b">已过闸门</span>':'<button class="btn sm pri" data-send="'+o.id+'">送合规闸门</button>')+'</div>'
    + '</div><div class="b">事实来源：'+esc(o.src)+' · 通道：'+esc(o.prov)+' · 消耗 '+o.credit+' Credit<br>结构化要素：实体明确 / 问答式小标题 / 可独立引用断言 / 数据点 / 出处锚</div></div>';
}

function viewCalendar(){
  var days = ['周一','周二','周三','周四','周五','周六','周日'];
  var cells = [];
  for(var i=0;i<28;i++){
    var has = [1,3,5,8,10,12,15,17,19,22,24,26].indexOf(i)>=0;
    var plat = ['公众号','抖音','B站','小红书','视频号'][i%5];
    cells.push('<div style="border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-height:76px;background:'+(has?'#fcfdf9':'#fff')+'">'
      + '<div style="font-size:10.5px;color:var(--ink3)">'+(i+1)+' 日</div>'
      + (has?('<div style="font-size:11.5px;margin-top:5px;line-height:1.5">'+plat+'<br><span style="color:var(--ink3)">已排 '+((i%3)+1)+' 条</span></div>'):'')
      + '</div>');
  }
  return ph('内容日历','一次排一个月的量，按各平台发布节奏自动排期。服务号 4 次/月、B站 5 稿/天这类硬约束会内置到排期规则里。',
      '<button class="btn pri" data-toast="已按最优节奏自动排期 12 条（避开平台限流）">自动排期</button><button class="btn" data-go="gen">去生成内容</button>')
  + '<div class="card"><div class="hd"><h3>2026 年 11 月（示意）</h3><div class="r"><span class="tag t-g">双列 4 周</span></div></div><div class="bd">'
  + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px">'+days.map(function(d){return '<div style="font-size:11px;color:var(--ink3);text-align:center">'+d+'</div>';}).join('')+'</div>'
  + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px">'+cells.join('')+'</div>'
  + '</div></div>';
}

function viewCompliance(){
  var pending = state.gen.out.filter(function(o){ return !state.pass.some(function(p){return p.id===o.id;}); });
  var c = state.checks;
  var allOk = c.identify && c.words && c.rule && (c.avatar || state.gen.fmt!=='avatar');
  var s = ph('合规闸门','AI 生成内容按 GB 45438-2025 需带显式标识与元数据；数字人口播还需形象与声音授权留痕。全部通过才能进入分发。');
  if(!state.gen.out.length){
    return s + '<div class="card"><div class="bd"><div class="empty">还没有待检内容。先去「内容工厂」生成一批。</div><div style="text-align:center"><button class="btn pri" data-go="gen">去内容工厂</button></div></div></div>';
  }
  s += '<div class="card"><div class="hd"><h3>待检内容 '+pending.length+' 条</h3><span class="sub">选一条逐项过检</span></div><div class="bd">';
  if(!pending.length){ s += '<div class="empty">本轮内容已全部通过闸门，可前往发布中心。</div><div style="text-align:center"><button class="btn pri" data-go="publish">去发布中心</button></div>'; }
  else {
    pending.forEach(function(o){
      s += '<div class="item"><div class="h"><span class="t">'+esc(o.title)+'</span><span class="tag t-g">'+esc(o.fmt)+'</span><div class="r"><button class="btn sm" data-check="'+o.id+'">开始校验</button></div></div><div class="b">来源：'+esc(o.src)+'</div></div>';
    });
  }
  s += '</div></div>';
  s += '<div class="card"><div class="hd"><h3>校验项</h3><div class="r"><button class="btn sm pri" id="btnPass" '+(allOk?'':'disabled')+'>确认通过，送往发布中心</button></div></div><div class="bd">'
    + chkRow('identify','AI 标识注入（显式水印 + 隐式元数据）')
    + chkRow('words','敏感词与夸大宣称检查')
    + chkRow('rule','目标平台规则预检（禁站外导流 / 封面规范）')
    + (state.gen.fmt==='avatar' ? chkRow('avatar','数字人形象与声音授权留痕') : '<div class="chk" style="opacity:.5"><div class="bx"></div>数字人授权留痕（本轮未使用数字人形态，无需）</div>')
    + '<div class="hint">演示提示：点「开始校验」会依次自动打勾，全部为绿后「确认通过」按钮才可用。</div>'
  + '</div></div>';
  return s;
}
function chkRow(k, label){
  var ok = state.checks[k];
  return '<div class="chk'+(ok?' ok':'')+'"><div class="bx"></div>'+esc(label)+(ok?'<span style="margin-left:auto"><span class="tag t-b">通过</span></span>':'')+'</div>';
}

function viewPublish(){
  var s = ph('发布中心','可直发平台进队列按限流排期；不可直发的平台生成「人工粘贴包」，含文案、图、视频与手机扫码直达。');
  if(!state.pass.length){
    return s + '<div class="card"><div class="bd"><div class="empty">还没有通过合规的内容。先去「合规闸门」过检。</div><div style="text-align:center"><button class="btn pri" data-go="compliance">去合规闸门</button></div></div></div>';
  }
  s += '<div class="card"><div class="hd"><h3>待分发 '+state.pass.length+' 条</h3><div class="r">'
    + '<button class="btn pri" id="btnPub" '+(state.pub.running?'disabled':'')+'>'+(state.pub.running?'分发中…':'一键分发到 5 个平台')+'</button></div></div><div class="bd">'
    + state.pass.map(function(o){ return '<div class="item"><div class="h"><span class="t">'+esc(o.title)+'</span><span class="tag t-t">GEO '+o.geo+'</span><span class="tag t-bl">合规通过</span></div></div>'; }).join('')
    + '</div></div>';
  s += '<div class="card"><div class="hd"><h3>分发状态</h3><span class="sub">同一内容 × 每个平台 = 一条记录</span></div><div class="bd">';
  if(!state.pub.rows.length){ s += '<div class="empty">点上方「一键分发」开始，会看到两类平台的不同处理方式。</div>'; }
  else {

function runGen(){
  var g = state.gen;
  if(g.running) return;
  var p = PROVIDERS.filter(function(x){return x.id===g.prov;})[0];
  var fmtName = FORMATS.filter(function(x){return x.id===g.fmt;})[0].t;
  var credit = estimateCredit();
  g.running = true; g.progs = 0; g.log = []; g.out = [];
  renderMain();
  var steps = [
    [4,  '解析素材：'+g.src.length+' 个来源，抽取实体与数据点'],
    [16, '注入 GEO 结构化要素（实体 / 问答标题 / 断言句 / 出处锚）'],
    [34, '调用生成通道：<b>'+p.name+'</b>（'+p.cap+'）'],
    [56, '通道排队中 · 预计 '+ (p.id==='txt'?'8':'260') +' 秒'],
    [76, '素材回传中台存储（不回传合作方临时链接）'],
    [88, '注入 AI 生成标识（显式水印 + 隐式元数据）'],
    [96, '计费入账：'+credit+' Credit'],
    [100,'生成完成，'+ (g.fmt==='txt'?'2':'1') +' 条产物入库']
  ];
  var i = 0;
  var timer = setInterval(function(){
    if(i >= steps.length){
      clearInterval(timer);
      g.running = false;
      var title = (g.fmt==='txt' ? '嘉法狮 PC 原料科普：成分问答体' : (g.fmt==='vid'?'产品短视频：原料微距 + 字幕解说':'数字人口播：成分答疑 60 秒'));
      g.out = [{
        id:'o'+(Date.now()),
        title:title,
        fmt:fmtName, geo: g.fmt==='txt'? '92' : '86',
        src: g.src.length+' 个来源', prov: p.name, credit: credit
      }];
      T().credits += credit;
      renderCredit(); renderMain();
      toast('生成完成，消耗 '+credit+' Credit');
      return;
    }
    var st = steps[i];
    g.progs = st[0];
    g.log.push('· '+st[1]);
    var bar = $('#progBar'), lg = $('#genLog');
    if(bar) bar.style.width = g.progs+'%';
    if(lg){ lg.innerHTML = g.log.join('<br>'); lg.scrollTop = lg.scrollHeight; }
    i++;
  }, 420);
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-tenant],[data-view],[data-go],[data-src],[data-fmt],[data-prov],[data-send],[data-check],[data-toast],[data-plugin-on],[data-plugin-off]');
  if(!el) {
    if(e.target && e.target.id==='btnGen') runGen();
    if(e.target && e.target.id==='btnPass') doPass();
    if(e.target && e.target.id==='btnPub') doPublish();
    return;
  }
  if(el.dataset.tenant){ setTenant(el.dataset.tenant); return; }
  if(el.dataset.view){ setView(el.dataset.view); return; }
  if(el.dataset.go){ setView(el.dataset.go); return; }
  if(el.dataset.toast){ toast(el.dataset.toast); return; }
  if(el.dataset.src){
    var i = state.gen.src.indexOf(el.dataset.src);
    if(i>=0) state.gen.src.splice(i,1); else state.gen.src.push(el.dataset.src);
    renderMain(); return;
  }
  if(el.dataset.fmt){
    state.gen.fmt = (state.gen.fmt===el.dataset.fmt) ? null : el.dataset.fmt;
    state.gen.prov = null; renderMain(); return;
  }
  if(el.dataset.prov){ state.gen.prov = el.dataset.prov; renderMain(); return; }
  if(el.dataset.send){
    var o = state.gen.out.filter(function(x){return x.id===el.dataset.send;})[0];
    if(o && !state.pass.some(function(p){return p.id===o.id;})){
      o.staged = true;
      state.checks = { identify:false, words:false, rule:false, avatar:false };
    }
    setView('compliance'); toast('已送入合规闸门，请逐项校验'); return;
  }
  if(el.dataset.check){ runChecks(el.dataset.check); return; }
  if(el.dataset.pluginOn){ togglePlugin(el.dataset.pluginOn, true); return; }
  if(el.dataset.pluginOff){ togglePlugin(el.dataset.pluginOff, false); return; }
});

function togglePlugin(k, on){
  var arr = state.plugins[state.tenant];
  if(on){
    if(arr.indexOf(k)<0) arr.push(k);
    toast('已启用「'+PLUGINS[k].name+'」，左侧菜单已更新');
  } else {
    var i = arr.indexOf(k);
    if(i>=0) arr.splice(i,1);
    toast('已停用「'+PLUGINS[k].name+'」，菜单已隐藏');
  }
  renderAll();
}

function runChecks(id){
  var seq = ['identify','words','rule'];
  if(state.gen.fmt==='avatar') seq.push('avatar');
  state.checks = { identify:false, words:false, rule:false, avatar:false };
  renderMain();
  var i = 0;
  var t = setInterval(function(){
    if(i>=seq.length){ clearInterval(t); toast('校验完成'); return; }
    state.checks[seq[i]] = true;
    $('#main').innerHTML = viewCompliance();
    i++;
  }, 500);
}

function doPass(){
  var pending = state.gen.out.filter(function(o){ return !state.pass.some(function(p){return p.id===o.id;}); });
  pending.forEach(function(o){ state.pass.push(o); });
  state.pub = { running:false, rows:[] };
  renderAll();
  toast('已通过闸门，'+pending.length+' 条内容送往发布中心');
  setView('publish');
}

function doPublish(){
  if(state.pub.running) return;
  state.pub.running = true;
  state.pub.rows = PLATFORMS.map(function(p){ return { n:p.n, mode:p.mode, lim:p.lim, eta:p.eta, st:'wait' }; });
  renderMain();
  var i = 0;
  var t = setInterval(function(){
    if(i >= state.pub.rows.length){
      clearInterval(t);
      state.pub.running = false;
      renderMain();
      toast('分发完成：3 个平台直发，2 个平台生成粘贴包');
      return;
    }
    var r = state.pub.rows[i];
    r.st = r.mode==='direct' ? 'done' : 'manual';
    renderMain();
    i++;
  }, 620);
}

document.documentElement.style.setProperty('--tenant', TENANTS[state.tenant].color);
renderAll();
})();
