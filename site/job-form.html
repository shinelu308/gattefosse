  <script>
    /* ===== 求职申请表：提交逻辑 =====
       1) 校验必填项与文件（原站规则：单个文件 / 2MB 以内 / pdf|doc|docx）
       2) 先上传简历到私有目录拿 token，再创建申请
       3) 成功后展示成功提示并重置表单
    */
    (function () {
      var MAX_SIZE = 2 * 1024 * 1024;
      var ALLOWED_EXT = ['.pdf', '.doc', '.docx'];

      function $(sel) { return document.querySelector(sel); }

      function setStatus(msg, type) {
        var el = $('#submitStatus');
        if (!el) return;
        el.textContent = msg || '';
        el.className = 'webform-submit-status' + (type ? ' is-' + type : '');
      }

      function extOf(name) {
        var i = String(name || '').lastIndexOf('.');
        return i < 0 ? '' : String(name).slice(i).toLowerCase();
      }

      /* 选中文件后回显文件名，并即时校验 */
      var fileInput = $('#edit-upload-your-resume-and-cover-letter-upload--2');
      if (fileInput) {
        fileInput.addEventListener('change', function () {
          var f = this.files && this.files[0];
          var nameEl = $('#resumeFileName');
          if (!f) { if (nameEl) nameEl.textContent = ''; return; }
          if (ALLOWED_EXT.indexOf(extOf(f.name)) < 0) {
            setStatus('简历只支持 pdf / doc / docx 格式', 'error');
            this.value = ''; if (nameEl) nameEl.textContent = '';
            return;
          }
          if (f.size > MAX_SIZE) {
            setStatus('简历文件过大，请控制在 2MB 以内', 'error');
            this.value = ''; if (nameEl) nameEl.textContent = '';
            return;
          }
          if (nameEl) nameEl.textContent = '已选择：' + f.name;
          setStatus('');
        });
      }

      var submitting = false;

      function submitForm() {
        if (submitting) return;

        var fullName = (($('#edit-first-name--2') || {}).value || '').trim();
        var email = (($('#edit-e-mail--2') || {}).value || '').trim();
        var countryEl = $('#edit-pays-country--2');
        var country = countryEl ? countryEl.value : '';
        var message = (($('#edit-your-text--2') || {}).value || '').trim();
        var agreedEl = $('#edit-terms-of-service--2');
        var honeypot = (($('#edit-url--2') || {}).value || '');
        var file = fileInput && fileInput.files ? fileInput.files[0] : null;

        if (!fullName) { setStatus('请填写姓名', 'error'); return; }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setStatus('请填写正确的邮箱地址', 'error'); return; }
        if (!country) { setStatus('请选择国家', 'error'); return; }
        if (!message) { setStatus('请填写内容', 'error'); return; }
        if (!file) { setStatus('请上传您的简历和求职信', 'error'); return; }
        if (agreedEl && !agreedEl.checked) { setStatus('请先阅读并同意隐私政策', 'error'); return; }

        submitting = true;
        var btn = $('#edit-submit--2');
        var oldVal = btn ? btn.value : '';
        if (btn) { btn.value = '提交中...'; btn.disabled = true; }
        setStatus('正在上传简历…', 'pending');

        var token = '';
        var originalName = '';

        var uploadStep = file
          ? (function () {
              var fd = new FormData();
              fd.append('file', file, file.name);
              return fetch(GatteAPI.BASE_URL + '/api/careers/resume', { method: 'POST', body: fd })
                .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
                .then(function (res) {
                  if (!res.ok || res.body.code !== 0) throw new Error(res.body.message || '简历上传失败');
                  token = res.body.data.token;
                  originalName = res.body.data.name || file.name;
                });
            })()
          : Promise.resolve();

        uploadStep
          .then(function () {
            setStatus('正在提交申请…', 'pending');
            return GatteAPI.Career.create({
              fullName: fullName,
              email: email,
              country: country,
              message: message,
              resumeToken: token,
              resumeName: originalName,
              agreed: true,
              url: honeypot
            });
          })
          .then(function () {
            setStatus('您的申请已经提交，感谢您对 Gattefossé 的关注！', 'success');
            var form = document.querySelector('.webform-submission-form');
            if (form) form.reset();
            var nameEl = $('#resumeFileName');
            if (nameEl) nameEl.textContent = '';
            if (countryEl) countryEl.value = 'China';
            var agreedReset = $('#edit-terms-of-service--2');
            if (agreedReset) agreedReset.checked = true;
          })
          .catch(function (err) {
            setStatus('提交失败：' + ((err && err.message) || '未知错误') + '，请稍后重试或发送邮件联系我们。', 'error');
          })
          .then(function () {
            submitting = false;
            if (btn) { btn.value = oldVal; btn.disabled = false; }
          });
      }

      document.addEventListener('DOMContentLoaded', function () {
        var btn = $('#edit-submit--2');
        if (btn) btn.addEventListener('click', submitForm);
      });
    })();
  </script>
