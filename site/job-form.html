      function $(sel) { return document.querySelector(sel); }
      function val(sel) { var el = $(sel); return el ? String(el.value || '') : ''; }

      function setStatus(msg, type) {
        var el = $('#submitStatus');
        if (!el) return;
        el.textContent = msg || '';
        el.className = 'webform-submit-status' + (type ? ' is-' + type : '');
      }

      function extOf(name) {
        var i = String(name || '').lastIndexOf('.');
        return i < 0 ? '' : String(name).slice(i).toLowerCase();
      }

      /* 文件选中即回显 + 即时校验 */
      function bindFile(inputId, nameId, required, label) {
        var input = document.getElementById(inputId);
        var nameEl = document.getElementById(nameId);
        if (!input) return;
        input.addEventListener('change', function () {
          var f = this.files && this.files[0];
          if (nameEl) nameEl.textContent = '';
          if (!f) return;
          if (ALLOWED_EXT.indexOf(extOf(f.name)) < 0) {
            setStatus(label + '只支持 pdf / doc / docx 格式', 'error');
            this.value = '';
            return;
          }
          if (f.size > MAX_SIZE) {
            setStatus(label + '文件过大，请控制在 2MB 以内', 'error');
            this.value = '';
            return;
          }
          if (nameEl) nameEl.textContent = '已选择：' + f.name;
          setStatus('');
        });
        input.dataset.required = required ? '1' : '';
      }

      /* 填充期望国家（HTML 里只保留「中国」占位，其余由 JS 注入） */
      function fillCountries() {
        var sel = $('#edit-pays-country--2');
        if (!sel || sel.dataset.filled) return;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < COUNTRIES.length; i++) {
          var o = document.createElement('option');
          o.value = COUNTRIES[i][0];
          o.textContent = COUNTRIES[i][1];
          frag.appendChild(o);
        }
        sel.appendChild(frag);
        sel.value = 'China'; /* 中国站点默认选中，与原中文站一致 */
        sel.dataset.filled = '1';
      }

      function uploadOne(file, kind) {
        var fd = new FormData();
        fd.append('file', file, file.name);
        return fetch(GatteAPI.BASE_URL + '/api/careers/upload?kind=' + kind, { method: 'POST', body: fd })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (res) {
            if (!res.ok || res.body.code !== 0) throw new Error(res.body.message || '附件上传失败');
            return res.body.data;
          });
      }

      var submitting = false;

      function submitForm() {
        if (submitting) return;

        var firstName = val('#edit-first-name--2').trim();
        var lastName = val('#edit-last-name--2').trim();
        var email = val('#edit-e-mail--2').trim();
        var position = val('#edit-desired-job--2').trim();
        var jobFunction = val('#edit-function--2');
        var country = val('#edit-pays-country--2');
        var message = val('#edit-your-text--2').trim();
        var agreedEl = $('#edit-terms-of-service--2');
        var honeypot = val('#edit-url--2');

        var resumeInput = document.getElementById('edit-upload-your-resume-upload--2');
        var coverInput = document.getElementById('edit-upload-your-cover-letter-upload--2');
        var resumeFile = resumeInput && resumeInput.files ? resumeInput.files[0] : null;
        var coverFile = coverInput && coverInput.files ? coverInput.files[0] : null;

        /* 校验顺序与页面字段顺序一致 */
        if (!firstName) { setStatus('请填写名', 'error'); return; }
        if (!lastName) { setStatus('请填写姓', 'error'); return; }
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setStatus('请填写正确的邮箱地址', 'error'); return; }
        if (!position) { setStatus('请填写期望岗位', 'error'); return; }
        if (!jobFunction) { setStatus('请选择职能领域', 'error'); return; }
        if (!country) { setStatus('请选择期望国家', 'error'); return; }
        if (!message) { setStatus('请填写内容', 'error'); return; }
        if (!resumeFile) { setStatus('请上传您的简历', 'error'); return; }
        if (agreedEl && !agreedEl.checked) { setStatus('请先阅读并同意隐私政策', 'error'); return; }

        submitting = true;
        var btn = $('#edit-submit--2');
        var oldVal = btn ? btn.value : '';
        if (btn) { btn.value = '提交中...'; btn.disabled = true; }
        setStatus('正在上传简历…', 'pending');

        var resume = null;
        var cover = null;

        uploadOne(resumeFile, 'resume')
          .then(function (d) {
            resume = d;
            if (!coverFile) return null;
            setStatus('正在上传求职信…', 'pending');
            return uploadOne(coverFile, 'cover').then(function (c) { cover = c; return null; });
          })
          .then(function () {
            setStatus('正在提交申请…', 'pending');
            return GatteAPI.Career.create({
              firstName: firstName,
              lastName: lastName,
              email: email,
              position: position,
              jobFunction: jobFunction,
              country: country,
              message: message,
              resumeToken: resume ? resume.token : '',
              resumeName: resume ? resume.name : '',
              coverLetterToken: cover ? cover.token : '',
              coverLetterName: cover ? cover.name : '',
              agreed: true,
              url: honeypot
            });
          })
          .then(function () {
            setStatus('您的申请已经提交，感谢您对 Gattefossé 的关注！', 'success');
            var form = document.querySelector('.webform-submission-form');
            if (form) form.reset();
            var rn = document.getElementById('resumeFileName');
            var cn = document.getElementById('coverLetterFileName');
            if (rn) rn.textContent = '';
            if (cn) cn.textContent = '';
            var cs = $('#edit-pays-country--2');
            if (cs) cs.value = 'China';
            var ag = $('#edit-terms-of-service--2');
            if (ag) ag.checked = true;
          })
          .catch(function (err) {
            setStatus('提交失败：' + ((err && err.message) || '未知错误') + '，请稍后重试或发送邮件联系我们。', 'error');
          })
          .then(function () {
            submitting = false;
            if (btn) { btn.value = oldVal; btn.disabled = false; }
          });
      }

      document.addEventListener('DOMContentLoaded', function () {
        fillCountries();
        bindFile('edit-upload-your-resume-upload--2', 'resumeFileName', true, '简历');
        bindFile('edit-upload-your-cover-letter-upload--2', 'coverLetterFileName', false, '求职信');
        var btn = $('#edit-submit--2');
        if (btn) btn.addEventListener('click', submitForm);
      });
    })();
  </script>
