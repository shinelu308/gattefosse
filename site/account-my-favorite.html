            color: #3a3f42;
          }
          .fav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 26px;
          }
          .fav-card {
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid #ece7d8;
            border-radius: 6px;
            overflow: hidden;
            transition: box-shadow .25s ease, transform .25s ease;
          }
          .fav-card:hover {
            box-shadow: 0 10px 26px rgba(58, 63, 66, .12);
            transform: translateY(-3px);
          }
          .fav-card__img {
            display: block;
            aspect-ratio: 4 / 3;
            background: #f7f5ef;
            overflow: hidden;
          }
          .fav-card__img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s ease;
          }
          .fav-card:hover .fav-card__img img {
            transform: scale(1.04);
          }
          .fav-card__noimg {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9c2ad;
            font-size: 4rem;
          }
          .fav-card__body {
            flex: 1;
            padding: 18px 20px 6px;
          }
          .fav-card__cat {
            display: inline-block;
            font-size: 1.1rem;
            letter-spacing: .08em;
            color: #8eb73c;
            border: 1px solid #8eb73c;
            border-radius: 999px;
            padding: 2px 10px;
            margin-bottom: 10px;
          }
          .fav-card__name {
            display: block;
            font-size: 1.8rem;
            font-weight: 600;
            color: #3a3f42;
            line-height: 1.35;
            margin-bottom: 8px;
          }
          .fav-card__name:hover {
            color: #8eb73c;
          }
          .fav-card__desc {
            font-size: 1.3rem;
            color: #74797D;
            line-height: 1.6;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
          }
          .fav-card__foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px 16px;
            border-top: 1px solid #f2efe6;
            margin-top: 14px;
          }
          .fav-card__link {
            font-size: 1.3rem;
            color: #8eb73c;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
          }
          .fav-card__link:hover {
            text-decoration: underline;
          }
          .fav-card__remove {
            background: none;
            border: 1px solid transparent;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #a6acb0;
            cursor: pointer;
            transition: all .2s ease;
          }
          .fav-card__remove:hover {
            color: #d9534f;
            border-color: #d9534f;
            background: #fdf3f3;
          }

          /* ===== 空状态 ===== */

    <script setup>
        const params = new URLSearchParams(window.location.search);
        const tokenStr = params.get('_token');
        const goodsCategoryId = params.get('i'); // "关联产品分类ID"
        var w = params.get('keyword'); //搜索关键词
        var exp = params.get('expertise'); //搜索关键词
        var atype = params.get('atype'); //0所有，1新闻，2活动
        var countryId = params.get('countryId');
        var curPage = params.get('page');
        var curUrl = window.location.href;
        var hasParam = curUrl.indexOf('?');
        var hasTypeParam = curUrl.indexOf('i=');
        var total = 0, count_0 = 0, count_1 = 0, count_2 = 0;
        const { createApp, reactive, getCurrentInstance, ref, router, nextTick } = Vue;
        const app = createApp({
            setup() {
                const data = reactive({
                    name: "aa",
                    formData: [],
                    total: total,
                    count_0: count_0,
                    count_1: count_1,
                    count_2: count_2,
                    cur_page: curPage == null ? 1 : curPage,
                    page_size: 10000,
                    total_page: 1,
                    prev_url: '',
                    next_url: '',
                    keyword: w,
                    type: atype,
                    goodsCategoryId: goodsCategoryId,
                    hasParam: hasParam,
                    hasTypeParam: hasTypeParam,
                });
                // 查询
                    const getTableData = () => {
                        GatteAPI.Favorite.list({ limit: 50 }).then((res) => {
                            // 拦截器解包后 res.data = {list, pagination}；兼容数组
                            const payload = res.data;
                            const favorites = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.list) ? payload.list : []);
                            if (favorites.length === 0) {
                                data.formData = [];
                                return;
                            }
                            // 批量获取产品详情
                            const snippet = (s) => (s || '').split('\n')[0].replace(/\s+/g, ' ').trim().slice(0, 60);
                            const detailPromises = favorites.map((fav) => {
                                if (fav.itemType === 'pc_ingredient' || fav.itemType === 'pc' || fav.itemType === 'PcProduct') {
                                return GatteAPI.PcProduct.detail(fav.itemId).then((prodRes) => {
                                    const product = prodRes.data;
                                    return {
                                        ID: fav.id,
                                        type: '6',
                                        url: '/personal-care/product-finder/product-detail.html?id=' + fav.itemId,
                                        imageUrl: product.imageUrl || '',
                                        desc: product.tagline || snippet(product.description) || product.inciName || '',
                                        goodsName: product.name || product.title,
                                        goodsCategoryName: '个人护理',
                                        title: product.name || product.title,
                                        targetId: fav.itemId,
                                        goodsCategoryId: 1,
                                    };
                                });
                            } else if (fav.itemType === 'pharma' || fav.itemType === 'PharmaProduct') {
                                return GatteAPI.PharmaProduct.detail(fav.itemId).then((prodRes) => {
                                    const product = prodRes.data;
                                    return {
                                        ID: fav.id,
                                        type: '6',
                                        url: '/pharmaceuticals/product-finder/product-detail.html?id=' + fav.itemId,
                                        imageUrl: product.imageUrl || '',
                                        desc: product.tagline || snippet(product.description) || product.inciName || '',
                                        goodsName: product.name || product.title,
                                        goodsCategoryName: '药用辅料',
                                        title: product.name || product.title,
                                        targetId: fav.itemId,
                                        goodsCategoryId: 117,
                                    };
                                });
                            } else {
                                // 新闻/其他类型
                                return Promise.resolve({
                                    ID: fav.id,
                                    type: '1',
                                    url: '/news-detail.html?id=' + fav.itemId,
                                    title: 'Item ' + fav.itemId,
                                    targetId: fav.itemId,
                                });
                            }
                        });
                        Promise.all(detailPromises).then((results) => {
                            data.formData = results;
                        }).catch((err) => {
                            console.log(err);
                        });
                    }).catch((err) => {
                        console.log(err);
                    });
                }
                getTableData()
                const delFav = (idx, item) => {
                    GatteAPI.Favorite.remove(item.ID).then((res) => {
                        data.formData.splice(idx, 1);
                    }).catch((err) => {
                        console.log(err);
                        showDialog('取消收藏失败，请重试');
                    });
                }
                return {
                    data,
                    delFav
                };
            }
        });
        let result = app.mount("#app");
    </script>
