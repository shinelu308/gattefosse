  <script>
  function checkLoginStatus() { return false; }
  const { createApp, reactive, onMounted } = Vue;
  const app = createApp({
    setup() {
      const data = reactive({
        formData: { title: '', summary: '', content: '', imageUrl: '', topBackground: '' },
        related: []
      });

      const loadNews = async () => {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || params.get('ID');
        if (!id) return;
        try {
          var res = await GatteAPI.News.detail(id);
          var item = res.data || {};
          data.formData = {
            title: item.title || '',
            summary: item.summary || '',
            content: item.contentHtml || item.content || '',
            imageUrl: item.imageUrl || '',
            topBackground: item.topBackground || ''
          };
        } catch (err) {
          console.error('News detail load failed:', err);
        }
        try {
          var relRes = await GatteAPI.News.list({ limit: 3, isPublished: 'true', type: 'news,event' });
          var payload = relRes.data || {};
          var list = payload.list || payload.items || (Array.isArray(payload) ? payload : []);
          data.related = list.filter(function (n) { return String(n.id) !== String(id); }).slice(0, 3);
        } catch (err) {
          console.error('Related news load failed:', err);
        }
      };

      onMounted(loadNews);
      return { data };
    }
  });
  app.mount("#app");
</script>
