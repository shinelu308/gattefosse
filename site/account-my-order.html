        /* ===== 我的订单：订单卡片 ===== */
        .order-page {
            display: block !important;
            padding: 30px 0 60px;
        }
        .order-count {
            font-size: 1.4rem;
            color: #74797D;
            margin: 0 0 20px;
        }
        .order-count strong {
            color: #3a3f42;
        }
        .order-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .order-card {
            background: #fff;
            border: 1px solid #ece7d8;
            border-radius: 6px;
            overflow: hidden;
        }
        .order-card__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px 24px;
            background: #faf8f2;
            border-bottom: 1px solid #f0ece0;
        }
        .order-card__no {
            font-size: 1.4rem;
            color: #74797D;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .order-card__no strong {
            font-size: 1.5rem;
            color: #3a3f42;
        }
        .order-card__badge {
            display: inline-block;
            font-size: 1.2rem;
            line-height: 1;
            padding: 5px 12px;
            border-radius: 999px;
            letter-spacing: .05em;
        }
        .order-card__badge.is-submitted { background: #eef4fd; color: #2f6fbf; }
        .order-card__badge.is-processing { background: #fdf3e7; color: #c07a2f; }
        .order-card__badge.is-shipped { background: #e9f5f4; color: #2f8f88; }
        .order-card__badge.is-completed { background: #f0f6e3; color: #6f9a24; }
        .order-card__badge.is-cancelled { background: #f2f3f4; color: #8a9196; }
        .order-card__badge.is-draft { background: #f2f3f4; color: #8a9196; }
        .order-card__date {
            font-size: 1.3rem;
            color: #a6acb0;
        }
        .order-card__body {
            padding: 10px 24px;
        }
        .order-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #f5f2ea;
            text-decoration: none;
        }
        .order-item:last-child {
            border-bottom: none;
        }
        .order-item__img {
            flex: 0 0 64px;
            width: 64px;
            height: 64px;
            border-radius: 4px;
            overflow: hidden;
            background: #f7f5ef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9c2ad;
            font-size: 2.2rem;
        }
        .order-item__img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .order-item__info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .order-item__name {
            font-size: 1.6rem;
            color: #3a3f42;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .order-item:hover .order-item__name {
            color: #8eb73c;
        }
        .order-item__cat {
            font-size: 1.2rem;
            color: #8eb73c;
            letter-spacing: .05em;
        }
        .order-item__qty {
            flex: 0 0 auto;
            font-size: 1.4rem;
            color: #74797D;
        }
        .order-card__foot {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 14px 24px;
            border-top: 1px solid #f0ece0;
        }
        .order-card__contact {
            font-size: 1.3rem;
            color: #74797D;
        }
        .order-card__note {
            font-size: 1.3rem;
            color: #a6acb0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 40%;
        }

        /* ===== 空状态 ===== */
        .order-empty {

            padding: 80px 20px;
        }
        .order-empty__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: #f3f7e8;
            color: #8eb73c;
            font-size: 3.6rem;
            margin-bottom: 24px;
        }
        .order-empty__title {
            font-size: 2rem;
            color: #3a3f42;
            margin: 0 0 8px;
        }
        .order-empty__tip {
            font-size: 1.4rem;
            color: #74797D;
            margin: 0 0 28px;
        }

    <script setup>
        const params = new URLSearchParams(window.location.search);
        const tokenStr = params.get('_token');
        const goodsCategoryId = params.get('i'); // "关联产品分类ID"
        var w = params.get('keyword'); //搜索关键词
        var exp = params.get('expertise'); //搜索关键词
        var atype = params.get('atype'); //0所有，1新闻，2活动
        var countryId = params.get('countryId');
        var curPage = params.get('page');
        var curUrl = window.location.href;
        var hasParam = curUrl.indexOf('?');
        var hasTypeParam = curUrl.indexOf('i=');
        var total = 0, count_0 = 0, count_1 = 0, count_2 = 0;
        const { createApp, reactive, getCurrentInstance, ref, router, nextTick } = Vue;
        const app = createApp({
            setup() {
                const data = reactive({
                    name: "aa",
                    formData: [],
                    total: total,
                    count_0: count_0,
                    count_1: count_1,
                    count_2: count_2,
                    cur_page: curPage == null ? 1 : curPage,
                    page_size: 10000,
                    total_page: 1,
                    prev_url: '',
                    next_url: '',
                    keyword: w,
                    type: atype,
                    goodsCategoryId: goodsCategoryId,
                    hasParam: hasParam,
                    hasTypeParam: hasTypeParam,
                });
                // 查询
                const pad = (n) => String(n).padStart(2, '0');
                const formatTime = (val) => {
                    if (!val) return '';
                    const d = new Date(val);
                    if (isNaN(d.getTime())) return '';
                    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
                };
                const STATUS_TEXT = {
                    draft: '草稿', submitted: '已提交', processing: '处理中',
                    shipped: '已发货', completed: '已完成', cancelled: '已取消'
                };
                const statusText = (s) => STATUS_TEXT[s] || s;
                const snippet = (s) => (s || '').split('\n')[0].replace(/\s+/g, ' ').trim().slice(0, 50);
                // 解析单个订单项的产品信息（类型后端只存 productType/productId，需前端反查）
                const fallbackItem = (item) => ({
                    name: snippet((item.productType || 'product') + ' #' + item.productId),
                    cat: '', imageUrl: '', url: '#', qty: item.quantity || 1
                });
                const detailFor = (item) => {
                    const t = String(item.productType || '').toLowerCase();
                    if (t.indexOf('pc') > -1) {
                        return GatteAPI.PcProduct.detail(item.productId).then((r) => {
                            const p = r.data || {};
                            return {
                                name: p.name || ('产品 #' + item.productId),
                                cat: '个人护理', imageUrl: p.imageUrl || '',
                                url: '/personal-care/product-finder/product-detail.html?id=' + item.productId,
                                qty: item.quantity || 1
                            };
                        }).catch(() => fallbackItem(item));
                    }
                    if (t.indexOf('pharma') > -1) {
                        return GatteAPI.PharmaProduct.detail(item.productId).then((r) => {
                            const p = r.data || {};
                            return {
                                name: p.name || ('产品 #' + item.productId),
                                cat: '药用辅料', imageUrl: p.imageUrl || '',
                                url: '/pharmaceuticals/product-finder/product-detail.html?id=' + item.productId,
                                qty: item.quantity || 1
                            };
                        }).catch(() => fallbackItem(item));
                    }
                    return Promise.resolve(fallbackItem(item));
                };
                const getTableData = () => {
                    GatteAPI.Order.list({ limit: 20 }).then((res) => {
                        const orders = res.data.list || [];
                        if (!orders || orders.length === 0) {
                            data.formData = [];
                            return;
                        }
                        const orderPromises = orders.map((order) => {
                            return Promise.all((order.items || []).map(detailFor)).then((items) => ({
                                id: order.id,
                                orderNumber: order.orderNumber || ('#' + order.id),
                                status: order.status || 'submitted',
                                createdAt: formatTime(order.submittedAt || order.createdAt),
                                contactName: order.contactName || '',
                                phone: order.phone || '',
                                companyName: order.companyName || '',
                                notes: order.notes || '',
                                items
                            }));
                        });
                        Promise.all(orderPromises).then((list) => {
                            data.formData = list;
                        });
                    }).catch((err) => {
                        console.log(err);
                    });
                }
                getTableData()
                return {
                    data,
                    statusText
                };
            }
        });
        let result = app.mount("#app");
    </script>
