  <script src="/sites/default/files/js/js_i5lI8vq7DHLJcOEWGS5A-g6sfOp4mcnqdPWwI1EB-28.js"></script>
  <script src="/sites/default/files/js/js_cIUKHmKr1kWXi06l4jrQ8vSQ793pffiw2dzBkQNlquo.js"></script>
  <script src="/themes/custom/gattefosse/js/libraries/tarteaucitron/tarteaucitron.js?1713335246"></script>
  <script src="/sites/default/files/js/js_GNC1Ecpj6HhzyWZtpny_WMpUZV6JQVmbA4mtkS3E5IU.js"></script>
  <script src="/sites/default/files/js/js_W8q5R4oIsmRhsRjsbPGB5rAGV5-VpUYHfAmsY7Pxc74.js"></script>
  <script>
const { createApp, reactive } = Vue;
var isLoginNow = false;
try { if (typeof checkLoginStatus === 'function') isLoginNow = checkLoginStatus(); } catch (e) {}

// ===== URL参数 =====
var curUrl = window.location.href;
var params = new URLSearchParams(window.location.search);
var curPage = parseInt(params.get('page')) || 1;
var tagId = params.get('tagId'); // 年份字符串，如 2024
var w = params.get('keyword');
var baseUrl = window.location.pathname;
var apiBase = '/api';

// ===== 工具方法 =====
function goToUrl(url) { window.location.href = url; }
function delUrlParam(url, paramName) {
  paramName = paramName.replace(/[\[\]]/g, '\\$&');
  let regular = new RegExp('[?&]' + paramName + '(=([^&#]*)|&|#|$)');
  let val = regular.exec(url);
  if (val && val[2]) { url = url.replace(new RegExp('[?&]' + paramName + '=' + val[2]), ''); }
  if (url.indexOf('?') < 0) { url = url.replace(/&/, '?'); }
  return url;
}
function delParamAndGotoUrl(p) {
  var url = delUrlParam(curUrl, p);
  window.location.href = url;
}

// ===== Vue应用 =====
var app = createApp({
  setup() {
    var data = reactive({
      formData: [],
      tagList: [{ tagName: '\u5e74\u4efd', ID: 1, children: [] }], // [{tagName:'年份', children:[{ID,tagName,tagUrl}]}]
      tagId: tagId,
      curFilterTagName: '',
      total: 0,
      page_size: 6,
      total_page: 1,
      cur_page: curPage,
      isLogin: isLoginNow,
      userEnabled: null,
      activeFilterClass: (tagId && tagId != '0' && tagId != '') ? 'showDiv' : 'hidden',
      prev_url: '',
      next_url: '',
      keyword: w
    });

    // ===== 构建年份标签组（仅一组：年份） =====
    function buildGroups(years) {
      var group = {
        tagName: '年份', // 年份
        ID: 1,
        nameId: 'collapse-filtre-accordion-year_1',
        sharpeNameId: '#collapse-filtre-accordion-year_1',
        headerNameId: 'heading-filtre-accordion-addiactive_year',
        accordionNameId: 'accordion-filtre-accordion-addiactive_year',
        dataBlockPluginId: 'facet_block:addiactive_year',
        panelDivId1: 'year_1',
        class: 'facet-inactive block-facet--links block block-facets block-facet-blockaddiactive-year',
        children: []
      };
      (years || []).forEach(function (y) {
        var u = baseUrl + '?page=1&tagId=' + encodeURIComponent(y);
        if (w) u += '&keyword=' + encodeURIComponent(w);
        if (tagId && decodeURIComponent(tagId) === String(y)) {
          data.curFilterTagName = String(y);
          data.activeFilterClass = 'showDiv';
        }
        group.children.push({
          ID: String(y),
          tagName: String(y),
          tagUrl: u,
          dataDrupalFacetItemId: 'year-' + y,
          facetItemClass: 'facet-item'
        });
      });
      var groups = [];
      groups.push(group);
      return groups;
    }

    // ===== API URL =====
    function buildApiUrl() {
      var p = new URLSearchParams();
      p.set('type', 'magazine');
      p.set('page', String(data.cur_page));
      p.set('limit', '6');
      p.set('isPublished', 'true');
      if (w) p.set('keyword', w);
      if (tagId && tagId != '0' && tagId != '') p.set('tags', decodeURIComponent(tagId));
      return apiBase + '/news?' + p.toString();
    }

    // ===== 加载杂志数据 =====
    async function loadMagazines() {
      try {
        var resp = await fetch(buildApiUrl());
        var result = await resp.json();
        if (result.code !== 0) throw new Error(result.message || '加载失败');
        var d = result.data;
        data.total = d.pagination.total;
        data.total_page = d.pagination.totalPages;
        data.cur_page = parseInt(d.pagination.page);
        data.formData = d.list.map(function (item) {
          return {
            ID: item.id,
            title: item.title || '',
            thumb: item.imageUrl || '',
            url: item.pdfUrl || '',
            lock: !!item.lock
          };
        });
        var tp = (tagId && tagId != '0' && tagId != '') ? '&tagId=' + encodeURIComponent(tagId) : '';
        var kw = w ? '&keyword=' + encodeURIComponent(w) : '';
        data.prev_url = data.cur_page > 1 ? baseUrl + '?page=' + (data.cur_page - 1) + tp + kw : '#';
        data.next_url = data.cur_page < data.total_page ? baseUrl + '?page=' + (data.cur_page + 1) + tp + kw : '#';
      } catch (e) {
        console.error('加载杂志失败:', e);
        data.formData = [];
        data.total = 0;
      }
    }

    // ===== 加载年份标签 =====
    async function loadTags() {
      try {
        var resp = await fetch(apiBase + '/news/tags/list?type=magazine');
        var result = await resp.json();
        if (result.code !== 0) return;
        var tags = result.data || [];
        var years = tags.filter(function (t) { return /^\d{4}$/.test(String(t)); });
        years.sort(function (a, b) { return b - a; }); // 降序：2024→2019
        data.tagList = buildGroups(years);
      } catch (e) {
        console.error('加载年份标签失败:', e);
        data.tagList = buildGroups([]);
      }
    }

    // 初始化：先加载标签，再加载杂志
    loadTags().then(function () { loadMagazines(); });
    return { data, goToUrl, delParamAndGotoUrl };
  }
});
app.mount('#app');

// 如果有关键词，回填搜索框
if (w && w != '') {
  var kwInput = document.getElementById('edit-keyword');
  if (kwInput) kwInput.value = w;
}
</script>
