  <style>
    /* CSR 页面自定义样式 */
    .csr-hero {
      padding: 80px 0 40px;
      text-align: center;
      background: linear-gradient(135deg, #f8f6f1 0%, #fff 100%);
    }
    .csr-hero h1 { font-size: 36px; font-weight: 700; color: #232426; margin-bottom: 20px; }
    .csr-hero p { font-size: 18px; line-height: 1.6; color: #58616B; max-width: 800px; margin: 0 auto; }
    .csr-hero p strong { color: #232426; }
    
    .csr-stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      margin: 48px 0;
    }
    .csr-stat-card {
      text-align: center;
      padding: 30px 16px;
      background: #fff;
      border: 1px solid #F0EBE4;
      border-radius: 8px;
    }
    .csr-stat-number {
      font-size: 32px;
      font-weight: 700;
      color: #8EB73C;
      line-height: 1.2;
    }
    .csr-stat-label {
      font-size: 13px;
      color: #58616B;
      margin-top: 8px;
      line-height: 1.5;
    }
    
    .csr-text {
      font-size: 16px;
      line-height: 1.7;
      color: #3C4248;
      margin: 32px 0;
    }
    .csr-text h2 {
      font-size: 24px;
      font-weight: 700;
      color: #232426;
      margin: 40px 0 16px;
    }
    .csr-text a { color: #8EB73C; text-decoration: underline; }
    
    .csr-pillar-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin: 40px 0;
    }
    .csr-pillar-card {
      border: 1px solid #F0EBE4;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .csr-pillar-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .csr-pillar-card-body {
      padding: 20px;
    }
    .csr-pillar-card-body h3 {
      font-size: 18px;
      font-weight: 700;
      color: #232426;
      margin: 0 0 10px;
    }
    .csr-pillar-card-body p {
      font-size: 14px;
      line-height: 1.6;
      color: #58616B;
      margin: 0 0 16px;
    }
    .csr-pillar-card-body a {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: #8EB73C;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .csr-pillar-card-body a:hover { text-decoration: underline; }
    
    .csr-quote {
      margin: 48px 0;
      padding: 40px;
      background: #F8F6F1;
      border-radius: 8px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .csr-quote img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .csr-quote blockquote {
      margin: 0;
      padding: 0;
      border: none;
      font-size: 16px;
      line-height: 1.7;
      color: #3C4248;
      font-style: italic;
    }
    .csr-quote cite {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      color: #232426;
      font-weight: 600;
      font-style: normal;
    }
    .csr-quote cite span {
      font-weight: 400;
      color: #58616B;
    }

    @media (max-width: 768px) {
      .csr-stats { grid-template-columns: repeat(2, 1fr); }
      .csr-pillar-cards { grid-template-columns: 1fr; }
      .csr-quote { flex-direction: column; align-items: center; text-align: center; }
    }
  </style>
</head>
<body class="path-node page-node-type-page bg- d-flex flex-column">
  <nav role="navigation" aria-label="Accès rapide au contenu">
    <a href="#main-content" class="visually-hidden focusable skip__link">
      <span class="skip__link__text">Saut au contenu</span>
    </a>
  </nav>
  <div class="dialog-off-canvas-main-canvas d-flex flex-column h-100" data-off-canvas-main-canvas>
    <header role="banner" class="header" id="header"></header>
    <div class="region region-highlight">
      <div data-drupal-messages-fallback class="hidden"></div>
    </div>
    <main role="main" class="main theme-cosm" data-bs-spy="scroll">
      <nav role="navigation" class="quick-access">
        <button class="quick-access__button quick-access__button--open js-open">
          <i class="o-icon --list" aria-hidden="true"></i>
          <strong>快捷链接</strong>
        </button>
        <div class="quick-access__menu">
          <button class="quick-access__button quick-access__button--close js-close">
            <i class="o-icon --cross" aria-hidden="true"></i>关闭
          </button>
          <div id="quickLinks"></div>
        </div>
      </nav>
      <div class="page-content">
        <div class="region region-breadcrumb">
          <div class="block block-system block-system-breadcrumb-block">
            <nav aria-label="breadcrumb">
              <h2 class="visually-hidden">Breadcrumb</h2>
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">首页</a></li>
                <li class="breadcrumb-item">企业社会责任</li>
              </ol>
            </nav>
          </div>
        </div>
        <a id="main-content" tabindex="-1"></a>
        <div class="region region-content" id="app">
          <div class="block block-system block-system-main-block">
            <div class="container" style="padding:40px 0 80px;">
              <!-- Loading -->
              <div v-if="loading" style="text-align:center;padding:80px 0;color:#999;">加载中...</div>
              <!-- Error -->
              <div v-else-if="error" style="text-align:center;padding:80px 0;color:#C4004D;">{{ error }}</div>
              <!-- Content -->
              <template v-else-if="pageData">
                <div v-for="(block, bi) in pageData.blocks" :key="bi">
                  
                  <!-- Hero -->
                  <div v-if="block.type === 'hero'" class="csr-hero">
                    <h1>{{ block.data.title }}</h1>
                    <p v-html="block.data.summary"></p>
                  </div>

                  <!-- Stats -->
                  <div v-if="block.type === 'stats' && block.data.items" class="csr-stats">
                    <div v-for="(item, si) in block.data.items" :key="si" class="csr-stat-card">
                      <div class="csr-stat-number">{{ item.unit }}{{ item.number }}</div>
                      <div class="csr-stat-label">{{ item.label }}</div>
                    </div>
                  </div>

                  <!-- Text -->
                  <div v-if="block.type === 'text'" class="csr-text" v-html="block.data.html"></div>

                  <!-- Pillar Cards -->
                  <div v-if="block.type === 'pillar_cards' && block.data.cards" class="csr-pillar-cards">
                    <div v-for="(card, ci) in block.data.cards" :key="ci" class="csr-pillar-card">
                      <img :src="card.imageUrl" :alt="card.title" loading="lazy">
                      <div class="csr-pillar-card-body">
                        <h3>{{ card.title }}</h3>
                        <p>{{ card.description }}</p>
                        <a :href="card.linkUrl">发现</a>
                      </div>
                    </div>
                  </div>

                  <!-- Quote -->
                  <div v-if="block.type === 'quote'" class="csr-quote">
                    <img :src="block.data.imageUrl" :alt="block.data.author" loading="lazy">
                    <div>
                      <blockquote>{{ block.data.text }}</blockquote>
                      <cite>{{ block.data.author }} <span>{{ block.data.title }}</span></cite>
                    </div>
                  </div>

                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
      <a href="#main-content" class="c-back-to-top smoothHide d-none"></a>
    </main>
    <footer role="contentinfo" class="footer" id="footer"></footer>
    <div class="modal modal--search" id="search-modal" tabindex="-1" aria-label="Search form" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <button role="button" aria-label="Close" class="btn btn-icon--l o-btn-close" data-bs-dismiss="modal">
            <i class="o-icon --cross" aria-hidden="true"></i><span>关闭</span>
          </button>
          <form action="/search.html" method="GET" class="modal--search__form">
            <h2 class="modal-title">您在找寻什么?</h2>
            <div class="form-item">
              <label class="visually-hidden" for="key">请输入关键词...</label>
              <input class="form-text form-control" placeholder="请输入关键词..." type="text" id="key" name="keyword" value="">
              <button type="submit" class="js-form-submit form-submit btn"><i class="o-icon --magnifying-glass" aria-hidden="true"></i></button>
            </div>
            <a href="/search.html" class="u-link">高级搜索</a>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/sites/default/files/js/js_cIUKHmKr1kWXi06l4jrQ8vSQ793pffiw2dzBkQNlquo.js"></script>
  <script src="/themes/custom/gattefosse/js/libraries/tarteaucitron/tarteaucitron.js?1713167250"></script>
  <script>
    const { createApp, ref, onMounted } = Vue;
    createApp({
      setup() {
        var pageData = ref(null);
        var loading = ref(true);
        var error = ref('');

        onMounted(async function() {
          try {
            var resp = await fetch('/api/content/pages/csr');
            var data = await resp.json();
            if (data.code === 0 && data.data) {
              var d = data.data;
              var blocks = [];
              if (d.content) {
                try { blocks = typeof d.content === 'string' ? JSON.parse(d.content) : d.content; } catch(e) {}
              }
              pageData.value = { title: d.title || '企业社会责任', blocks: blocks };
            } else {
              error.value = '页面数据加载失败';
            }
          } catch(e) {
            console.error('CSR load error:', e);
            error.value = '加载失败：网络错误';
          } finally {
            loading.value = false;
          }
        });

        return { pageData, loading, error };
      }
    }).mount('#app');
  </script>
</body>
