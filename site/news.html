  <script>
  function checkLoginStatus() { return false; }
  const { createApp, reactive, onMounted } = Vue;

  var typeFilter = new URLSearchParams(window.location.search).get('type') || '';
  var categoryFilter = new URLSearchParams(window.location.search).get('cat') || '';
  var keyword = new URLSearchParams(window.location.search).get('keyword') || '';
  var page = parseInt(new URLSearchParams(window.location.search).get('page')) || 1;
  var limit = 12;

  function formatDateParts(iso) {
    if (!iso) return { year: '', month: '', day: '', str: '' };
    var d = new Date(iso);
    if (isNaN(d.getTime())) return { year: '', month: '', day: '', str: '' };
    return {
      year: d.getFullYear(),
      month: ('0' + (d.getMonth() + 1)).slice(-2),
      day: ('0' + d.getDate()).slice(-2),
      str: d.getFullYear() + '年' + ('0' + (d.getMonth() + 1)).slice(-2) + '月' + ('0' + d.getDate()).slice(-2) + '日'
    };
  }

  function catLabel(cat) {
    var map = { corporate: '企业新闻', pc: '个人护理', pharma: '药用辅料' };
    return map[cat] || cat;
  }

  const app = createApp({
    setup() {
      const data = reactive({
        formData: [],
        total: 0,
        total_page: 1,
        cur_page: page,
        typeFilter: typeFilter,
        categoryFilter: categoryFilter,
        keyword: keyword,
        loading: false,
        filterOpen: false,
        categoryCounts: { all: 0, corporate: 0, pc: 0, pharma: 0 }
      });

      function goPage(p) {
        if (p < 1 || p > data.total_page) return;
        data.cur_page = p;
        loadNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function resetFilters() {
        data.categoryFilter = '';
        data.typeFilter = '';
        data.keyword = '';
        data.cur_page = 1;
        loadNews();
      }

      const loadNews = async () => {
        data.loading = true;
        var params = { limit: limit, page: data.cur_page, isPublished: 'true' };
        if (data.typeFilter) params.type = data.typeFilter;
        if (data.categoryFilter) params.category = data.categoryFilter;
        if (data.keyword) params.keyword = data.keyword;
        try {
          var res = await GatteAPI.News.list(params);
          var payload = res.data || {};
          var list = payload.list || payload.items || (Array.isArray(payload) ? payload : []);
          var pagination = payload.pagination || {};

          data.formData = list.map(function(item) {
            var d = formatDateParts(item.publishedDate);
            var isEvent = item.type === 'event';
            return {
              id: item.id,
              title: item.title,
              summary: item.summary || '',
              thumb: item.imageUrl || '',
              url: 'news-detail.html?id=' + item.id,
              isEvent: isEvent,
              catName: catLabel(item.category),
              dateStr: d.str,
              readingTime: item.readingTime || 0,
              location: item.location || '',
              eventDateNum: d.month + '月' + d.day,
              eventDateRange: d.year + '年',
            };
          });
          data.total = pagination.total || list.length;
          data.total_page = pagination.totalPages || Math.max(1, Math.ceil(data.total / limit));

          // 统计各分类数量
          if (payload.counts) {
            data.categoryCounts = payload.counts;
          } else {
            var all = data.total;
            var corp = 0, pc = 0, pharm = 0;
            list.forEach(function(item) {
              if (item.category === 'corporate') corp++;
              else if (item.category === 'pc') pc++;
              else if (item.category === 'pharma') pharm++;
            });
            data.categoryCounts = { all: all, corporate: corp, pc: pc, pharma: pharm };
          }
        } catch (err) {
          console.error('News list load failed:', err);
          data.formData = [];
        }
        data.loading = false;
      };

      onMounted(loadNews);
      return { data, goPage, resetFilters };
    }
  });
  app.mount("#app");
  </script>
