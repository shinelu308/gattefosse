  <script>
  function checkLoginStatus() { return false; }
  const { createApp, reactive, onMounted } = Vue;
  const app = createApp({
    setup() {
      const data = reactive({ formData: { title: '保护我们的环境 ⋅ 嘉法狮', content: '' } });
      onMounted(async () => {
        try {
          const res = await axios.get('/api/content/pages/preserving-our-environement');
          if (res.data && res.data.data) {
            const p = res.data.data;
            data.formData = { title: p.title || '保护我们的环境 ⋅ 嘉法狮', content: p.contentHtml || '' };
            document.title = p.metaTitle || (p.title + ' ⋅ 嘉法狮');
          } else {
            data.formData = { title: '保护我们的环境 ⋅ 嘉法狮', content: '<p>页面数据加载失败，请稍后重试。</p>' };
          }
        } catch (e) {
          console.error('[pillar] fetch pageContent failed', e);
          data.formData = { title: '保护我们的环境 ⋅ 嘉法狮', content: '<p>页面数据加载失败，请稍后重试。</p>' };
        }
        await Vue.nextTick();
        // 注入完成后触发 Drupal behaviors，初始化 key-figures / full-width slider
        initPillarBehaviors();
      });
      return { data };
    }
  });
  app.mount("#app");
    function initPillarBehaviors(tries) {
    tries = tries || 0;
    if (window.Drupal && Drupal.attachBehaviors) {
      try {
        var article = document.querySelector('article.node--type-page');
        Drupal.attachBehaviors(article || document);
      } catch (e) { console.error('[pillar] attachBehaviors', e); }
    } else if (tries < 60) {
      setTimeout(function () { initPillarBehaviors(tries + 1); }, 100);
    }
  }
</script>
  <script>
    $(document).ready(function () {

    function loadJS(url, success) {
      var domScript = document.createElement('script');
      domScript.src = url;
      success = success || function () {
      };
      domScript.onload = domScript.onreadystatechange = function () {
        if (!this.readyState || 'loaded' === this.readyState || 'complete' === this.readyState) {
          success();
          this.onload = this.onreadystatechange = null;
          this.parentNode.removeChild(this);
        }
      }
      document.getElementsByTagName('head')[0].appendChild(domScript);
    }


    var e = $('.paragraph--type--full-width-slider'),
      t = $('.js-full-width-slider'),
      l = $('.slick-counter__current'),
      n = $('.slick-counter__total');


    async function waitLoop(times, delay) {
      for (let i = 0; i < times; i++) {
        console.log(`等待开始 ${i}`);
        await new Promise(resolve => setTimeout(resolve, delay));
        console.log(`等待结束 ${i}`);
      }
    }

    if (e.length <= 0) {
      waitLoop(10, 1000);
    }
    function checkDivLoaded(id, callback) {
      if (getElementsByClassName(id)) {
        callback();
      } else {
        setTimeout(function () { checkDivLoaded(id, callback); }, 50);
        console.log(`又一次等待 `);
      }
    }

    // 使用方法
    checkDivLoaded('paragraph--type--full-width-slider', function () {
      console.log('DIV #myDiv is loaded!');
      // 执行其他操作
    });

    function getElementsByClassName(className) {
      var all = document.all ? document.all : document.getElementsByTagName(' *');
      var elements = new Array();
      for (var e = 0; e < all.length; e++) {
        if (all[e].className == className) {
          elements[elements.length] = all[e];
        }
      }
      return elements;
    }
    if (e.length && !t.hasClass('slick-initialized')) {
      t.on('init reInit afterChange',
        function (t, i, s, r) {
          if (!i.$dots) {
            return
          };
          var e = (s ? s : 0) + 1;
          l.text(e);
          n.text('/' + (i.$dots[0].children.length))
        });
      var i = 0;
      t.each(function () {
        i += 1;
        console.log("each" + i)
      })
    }
  </script>
