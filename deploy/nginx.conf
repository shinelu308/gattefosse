# ===== Nginx 站点配置 =====
# 宝塔用户：把下面内容粘贴到「网站 → 设置 → 配置文件」中（替换全部）
# 手动部署用户：保存为 /etc/nginx/conf.d/gattefosse.conf，然后 nginx -s reload
# 注意：把「你的域名.com」全部替换成真实域名

server {
    listen 80;
    server_name 你的域名.com www.你的域名.com;

    # 单个请求最大 50M（后台上传 PDF/图片用）
    client_max_body_size 50m;

    # 前台网站 / 后台 / 接口 全部交给 Node 程序（3000 端口）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传/接口响应慢时的超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 图片、PDF、CSS、JS 缓存 30 天，加快访问
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|pdf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/gattefosse_access.log;
    error_log  /var/log/nginx/gattefosse_error.log;
}
